<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#99252c">
    <title>تکمیل سفارش | آبی‌بی</title>
    <link rel="icon" href="assets/image/logo.webp">
    <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/hasti.css">
</head>

<body data-page="checkout">
    <header class="site-header">
        <div class="container-xxl d-flex align-items-center gap-3 py-3"><a href="home.html" class="brand"><img
                    src="assets/image/logo.webp" alt="لوگوی آبی‌بی"><span>
                    <img src="assets/image/abibi_seclogo.webp" class="logotype-header" alt="لوگوی آبی‌بی">
                </span></a>
            <nav class="d-none d-lg-flex gap-4 ms-4" aria-label="منوی اصلی"><a href="home.html">خانه</a><a
                    href="menu.html">منوی غذا</a><a href="club.html">باشگاه آبی‌بی</a></nav><a
                class="branch-link ms-auto" href="branches.html"><small>شعبه انتخاب‌شده</small><strong
                    data-branch-label>انتخاب شعبه</strong></a><a class="icon-btn position-relative" href="cart.html"
                aria-label="سبد خرید">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 7h14l1 14H4L5 7ZM8 7V5a4 4 0 0 1 8 0v2"></path>
                </svg>
                <span class="cart-count" data-cart-count>۰</span></a><a class="icon-btn d-none d-md-flex"
                href="dashboard.html" aria-label="حساب کاربری">○</a>
        </div>
        <!-- <div class="demo-strip">پیش‌نمایش طراحی · سفارش، عضویت و امتیازها نمایشی‌اند</div> -->
    </header>
    <main id="main" class="container-xxl main-content">
        <div class="page-heading">
            <h1>تکمیل سفارش</h1>
        </div>
        <form novalidate id="checkout-form">
            <div class="row g-4">
                <div class="col-lg-8">
                    <section class="surface mb-4">
                        <h2 class="h5 mb-3">۱. روش دریافت</h2>
                        <div class="btn-group w-100" role="group" aria-label="روش دریافت"><input class="btn-check"
                                type="radio" name="mode" id="delivery" value="delivery" checked><label
                                class="btn btn-outline-primary" for="delivery">ارسال با پیک</label><input
                                class="btn-check" type="radio" name="mode" id="pickup" value="pickup"><label
                                class="btn btn-outline-primary" for="pickup">تحویل حضوری</label></div>
                    </section>
                    <section class="surface mb-4">
                        <h2 class="h5 mb-4">۲. مشخصات دریافت‌کننده</h2>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="customer">نام و نام
                                    خانوادگی</label><input class="form-control" id="customer" name="customer" required
                                    autocomplete="name"></div>
                            <div class="col-md-6"><label class="form-label" for="phone">شماره موبایل</label><input
                                    class="form-control" id="phone" name="phone" required inputmode="tel" type="tel"
                                    autocomplete="tel"></div>
                            <div class="col-12" id="delivery-fields"><label class="form-label" for="saved-address">آدرس
                                    ذخیره‌شده</label><select id="saved-address" class="form-select mb-3">
                                    <option value="">واردکردن آدرس جدید</option>
                                </select><label class="form-label" for="address">آدرس تحویل</label><textarea
                                    class="form-control" id="address" name="address" required minlength="10"
                                    rows="3"></textarea></div>
                            <div class="col-12"><label for="note" class="form-label">توضیحات سفارش</label><input
                                    class="form-control" id="note" name="note"></div>
                        </div>
                    </section>
                    <section class="surface">
                        <h2 class="h5 mb-3">۳. زمان دریافت</h2><select class="form-select" name="timing" id="timing">
                            <option value="soon">اولین زمان ممکن (زمان نمونه: ۳۰ تا ۴۵ دقیقه)</option>
                            <option value="scheduled">زمان دلخواه</option>
                        </select><label class="form-label mt-3" for="schedule" id="schedule-label" hidden>تاریخ و ساعت
                            دریافت</label><input class="form-control" name="schedule" id="schedule"
                            type="datetime-local" hidden>
                    </section>
                </div>
                <aside class="col-lg-4">
                    <div class="surface sticky-summary">
                        <h2 class="h5">بازبینی سفارش</h2>
                        <div id="checkout-summary"></div>
                        <p class="notice">پرداخت آزمایشی است. مبلغی دریافت و پیامکی ارسال نمی‌شود.</p><button
                            class="btn btn-primary w-100" type="submit">ثبت سفارش نمایشی ←</button>
                    </div>
                </aside>
            </div>
        </form>
        <footer class="site-footer d-flex flex-wrap gap-3 justify-content-between"><span>آبی‌بی؛ یه دل سیر
                خاطره.</span><span>طراحی و توسعه سُها سیستم</span></footer>
    </main>
    <nav class="bottom-nav d-lg-none" aria-label="منوی موبایل"><a href="home.html" class="nav-item"><span
                class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 10 12 3l9 7v10h-6v-7H9v7H3Z" />
                </svg></span><span class="nav-label">خانه</span></a><a href="menu.html" class="nav-item"><span
                class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" />
                </svg></span><span class="nav-label">منو</span></a><a href="cart.html" class="nav-item nav-cart"
            data-cart-nav aria-label="سبد خرید، ۰ مورد"><span class="nav-icon"><svg viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path d="M5 7h14l1 14H4L5 7ZM8 7V5a4 4 0 0 1 8 0v2" />
                </svg><span class="nav-count" data-cart-count aria-hidden="true">۰</span></span><span
                class="nav-label">سبد خرید</span></a><a href="club.html" class="nav-item"><span class="nav-icon"><svg
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" />
                </svg></span><span class="nav-label">باشگاه</span></a><a href="dashboard.html" class="nav-item"><span
                class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2" />
                </svg></span><span class="nav-label">حساب من</span></a></nav>
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
        <div id="noticeToast" class="toast" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"></div><button type="button" class="btn-close me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="بستن"></button>
            </div>
        </div>
    </div>
    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/pages/checkout.js"></script>
    <script src="assets/vendor/just-validate/just-validate.production.min.js"></script>
    <script src="assets/js/validation.js"></script>
</body>

</html>
